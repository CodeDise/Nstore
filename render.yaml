# Render Blueprint — Nohara Store Bot (Free Web Service)
# Your secrets are written inside nohara_bot/config.py (MY_VALUES), so nothing else is needed here.
# (Keep your GitHub repo PRIVATE.)
services:
  - type: web
    name: nohara-store-multi-tenant-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
